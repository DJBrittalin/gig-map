name: Update gigs

# Runs whenever you upload a gig-page.html file (made by grab-gigs.js).
# It reads the gigs, finds any new venues on the map, updates docs/gigs.json,
# then deletes the uploaded file so the next upload starts fresh.
on:
  push:
    paths:
      - "gig-page*.html"
      - "venues.json"     # editing a venue's address re-runs the map lookups
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-gigs

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests beautifulsoup4

      - name: Read the gigs and find venues
        env:
          SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}
        run: |
          shopt -s nullglob
          files=(gig-page*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No new gig page uploaded, so just retrying venues that aren't on the map yet."
            python scrape.py --venues-only
          else
            python scrape.py --file "gig-page*.html"
          fi

      - name: Save the new data
        run: |
          git config user.name "gig-map bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -q --ignore-unmatch -- "gig-page*.html"
          git add docs/gigs.json venues.json
          git diff --cached --quiet || git commit -m "Update gigs"
          git pull --rebase -q
          git push
